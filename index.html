<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Necklace - eBook & Photo Album</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background-color: #1e1e1e;
      color: #2c2c2c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .book-container {
      display: flex;
      width: 960px;
      height: 640px;
      background: #fdfbf7;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      border-radius: 6px;
      overflow: hidden;
    }

    .page {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid #e2ddd5;
      line-height: 1.5;
      font-size: 0.92rem;
      background-color: #fdfbf7;
    }

    .page:last-child { border-right: none; }

    .story-title {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .story-author {
      text-align: center;
      font-style: italic;
      font-size: 0.95rem;
      margin-bottom: 20px;
      color: #555;
    }

    .page-content p {
      margin-bottom: 12px;
      text-align: justify;
      text-indent: 1.2em;
    }

    .page-number {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-top: 10px;
    }

    /* Photo Upload Styling */
    .photo-slot {
      border: 2px dashed #b5b0a6;
      border-radius: 8px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f6f3ed;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.2s;
    }

    .photo-slot:hover {
      background-color: #eee9e0;
    }

    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-slot input[type="file"] { display: none; }

    .photo-placeholder-text {
      color: #777;
      font-size: 0.95rem;
      text-align: center;
      padding: 15px;
    }

    /* Navigation Controls */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    button {
      padding: 10px 22px;
      font-size: 0.95rem;
      background-color: #3f3f3f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background-color: #111; }
    button:disabled { background-color: #666; cursor: not-allowed; opacity: 0.5; }

    .spread-indicator {
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="book-container">
    <!-- Left Page (Text Page) -->
    <div class="page" id="left-page">
      <div class="page-content" id="left-content"></div>
      <div class="page-number" id="left-num">Page 1</div>
    </div>

    <!-- Right Page (Photo Slot) -->
    <div class="page" id="right-page">
      <div class="page-content" id="right-content"></div>
      <div class="page-number" id="right-num">Page 2</div>
    </div>
  </div>

  <div class="controls">
    <button id="prev-btn" onclick="changeSpread(-1)">Previous</button>
    <span class="spread-indicator" id="spread-info">Spread 1 of 6</span>
    <button id="next-btn" onclick="changeSpread(1)">Next</button>
  </div>

  <script>
    const pagesData = [
      // Page 1
      {
        type: 'text',
        content: `
          <div class="story-title">The Necklace</div>
          <div class="story-author">by Guy de Maupassant</div>
          <p>She was one of those pretty and charming girls born, as though fate had blundered over her, into a family of artisans. She had no marriage portion, no expectations, no means of getting known, understood, loved, and wedded by a man of wealth and distinction; and she let herself be married off to a little clerk in the Ministry of Education. Her tastes were simple because she had never been able to afford any other, but she was as unhappy as though she had married beneath her.</p>
          <p>She suffered endlessly, feeling herself born for every delicacy and luxury. She suffered from the poorness of her house, from its mean walls, worn chairs, and ugly curtains. All these things, of which other women of her class would not even have been aware, tormented and insulted her...</p>
        `
      },
      // Page 2
      { type: 'photo', id: 'photo-1' },

      // Page 3
      {
        type: 'text',
        content: `
          <p>attractive and sought after. She had a rich friend, an old school friend whom she refused to visit, because she suffered so keenly when she returned home. She would weep whole days, with grief, regret, despair, and misery.</p>
          <p>One evening her husband came home with an exultant air, holding a large envelope in his hand. "Here's something for you," he said. Swiftly she tore the paper and drew out a printed card on which were these words: "The Minister of Education and Madame Ramponneau request the pleasure of the company of Monsieur and Madame Loisel at the Ministry on the evening of Monday, January the 18th."</p>
          <p>Instead of being delighted, as her husband hoped, she flung the invitation petulantly across the table, murmuring: "What do you want me to do with this?"</p>
        `
      },
      // Page 4
      { type: 'photo', id: 'photo-2' },

      // Page 5
      {
        type: 'text',
        content: `
          <p>The day of the party drew near, and Madame Loisel seemed sad, uneasy and anxious. Her dress was ready, however. One evening her husband said to her: "What's the matter with you? You've been very odd for the last three days." "I'm utterly miserable at not having any jewels, not a single stone, to wear," she replied.</p>
          <p>"Go and see Madame Forestier and ask her to lend you some jewels," exclaimed her husband. She uttered a cry of delight. "That's true, I never thought of it."</p>
          <p>Suddenly she discovered, in a black satin case, a superb diamond necklace; her heart began to beat covetously. She fastened it round her neck, upon her high dress, and remained in ecstasy at sight of herself...</p>
        `
      },
      // Page 6
      { type: 'photo', id: 'photo-3' },

      // Page 7
      {
        type: 'text',
        content: `
          <p>her. All the Under-Secretaries of State were eager to meet her. The Minister noticed her. She danced madly, with no thought for anything, in the triumph of her beauty...</p>
          <p>They reached their apartment. Suddenly she uttered a cry. The necklace was no longer round her neck!</p>
          <p>"What's the matter with you?" asked her husband. She turned towards him in the utmost distress. "I... I... I've no longer got Madame Forestier's necklace..." He started with astonishment. "What! Impossible!" They searched in the folds of her dress, in the pockets, everywhere. They could not find it.</p>
        `
      },
      // Page 8
      { type: 'photo', id: 'photo-4' },

      // Page 9
      {
        type: 'text',
        content: `
          <p>She waited all day long, in the same state of confusion at this fearful catastrophe. Loisel came home at night, his face lined and pale; he had discovered nothing. "You must write to your friend," he said, "and tell her that you've broken the clasp of her necklace and are getting it mended."</p>
          <p>By the end of a week they had lost all hope. Loisel declared: "We must see about replacing the diamonds." They went from jeweler to jeweler, searching for another necklace like the first...</p>
          <p>In a shop at the Palais-Royal they found a string of diamonds which seemed to them exactly like the one they were looking for. It was worth forty thousand francs. They were allowed to have it for thirty-six thousand...</p>
        `
      },
      // Page 10
      { type: 'photo', id: 'photo-5' },

      // Page 11
      {
        type: 'text',
        content: `
          <p>She came to know the heavy work of the house, the hateful duties of the kitchen. She washed the plates, wearing out her pink nails on the coarse pottery. She washed the dirty linen... And this life lasted ten years. At the end of ten years everything was paid off.</p>
          <p>One Sunday, as she had gone for a walk along the Champs-Elysées, she caught sight suddenly of a woman walking with a child. It was Madame Forestier, still young, still beautiful...</p>
          <p>Madame Forestier, deeply moved, took her two hands. "Oh, my poor Mathilde! But mine was imitation. It was worth at the very most five hundred francs!"</p>
        `
      },
      // Page 12
      { type: 'photo', id: 'photo-6' }
    ];

    let currentSpread = 0;

    function renderSpread() {
      const leftIdx = currentSpread * 2;
      const rightIdx = leftIdx + 1;

      renderPage('left-content', 'left-num', pagesData[leftIdx], leftIdx + 1);
      renderPage('right-content', 'right-num', pagesData[rightIdx], rightIdx + 1);

      document.getElementById('prev-btn').disabled = currentSpread === 0;
      document.getElementById('next-btn').disabled = currentSpread >= (pagesData.length / 2) - 1;
      document.getElementById('spread-info').textContent = `Spread ${currentSpread + 1} of ${pagesData.length / 2}`;
    }

    function renderPage(contentId, numId, pageData, pageNum) {
      const contentEl = document.getElementById(contentId);
      document.getElementById(numId).textContent = `Page ${pageNum}`;

      if (pageData.type === 'text') {
        contentEl.innerHTML = pageData.content;
      } else {
        contentEl.innerHTML = `
          <div class="photo-slot" onclick="triggerUpload('${pageData.id}')">
            <span class="photo-placeholder-text">📷 Click to upload photo for Page ${pageNum}</span>
            <input type="file" id="${pageData.id}" accept="image/*" onchange="previewImage(event, '${pageData.id}-img')">
            <img id="${pageData.id}-img" alt="Uploaded Photo">
          </div>
        `;
      }
    }

    function triggerUpload(inputId) {
      document.getElementById(inputId).click();
    }

    function previewImage(event, imgId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById(imgId);
          img.src = e.target.result;
          img.style.display = 'block';
          img.previousElementSibling.previousElementSibling.style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    }

    function changeSpread(direction) {
      currentSpread += direction;
      renderSpread();
    }

    renderSpread();
  </script>
</body>
</html>
